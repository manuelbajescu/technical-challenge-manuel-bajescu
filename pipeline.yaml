name: Production CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: mycompany-registry.io/apps/order-backend

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@<sha-v4>  # fixează pe SHA de commit
      - uses: actions/setup-python@<sha-v5>
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/
      - name: Helm lint and validate
        run: |
          helm lint charts/order-backend
          helm template charts/order-backend | kubeconform -strict -summary

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # pentru OIDC și cosign keyless
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@<sha-v4>
      - uses: docker/setup-buildx-action@<sha-v3>
      - uses: docker/login-action@<sha-v3>
        with:
          registry: mycompany-registry.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - id: push
        uses: docker/build-push-action@<sha-v6>
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@<sha>
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: sigstore/cosign-installer@<sha-v3>
      - run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production   # reviewer obligatoriu înainte de deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@<sha-v4>
      # Login OIDC la cloud și obținere kubeconfig (alege una dintre variante):
      # azure/login + azure/aks-set-context
      # aws-actions/configure-aws-credentials + aws eks update-kubeconfig
      # google-github-actions/auth + get-gke-credentials
      - name: Helm deploy
        run: |
          helm upgrade --install order-backend charts/order-backend \
            --namespace orders --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set image.digest=${{ needs.build.outputs.digest }} \
            --atomic --wait --timeout 10m