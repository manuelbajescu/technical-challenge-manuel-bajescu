name: Production CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: mycompany-registry.io/apps/order-backend

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - uses: azure/setup-helm@v4
      - run: pip install -r src/backend/requirements.txt
      - run: python -m compileall -q src/backend
      - name: Helm lint and validate
        run: |
          helm lint helm/app-chart
          helm template order-backend helm/app-chart > /dev/null

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # pentru OIDC și cosign keyless
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: mycompany-registry.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@v2
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: sigstore/cosign-installer@v2
      - run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      # Login OIDC la cloud și obținere kubeconfig (alege una dintre variante):
      # azure/login + azure/aks-set-context
      # aws-actions/configure-aws-credentials + aws eks update-kubeconfig
      # google-github-actions/auth + get-gke-credentials
      - name: Helm deploy
        run: |
          helm upgrade --install order-backend helm/app-chart \
            --namespace orders --create-namespace \
            --set-string image.tag=${{ github.sha }} \
            --atomic --wait --timeout 10m