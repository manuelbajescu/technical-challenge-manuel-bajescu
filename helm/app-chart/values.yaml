# Application Configuration Values
replicaCount: 1

image:
  repository: mycompany-registry.io/apps/order-backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

database:
  enabled: true
  host: postgresql-service.default.svc.cluster.local
  port: 5432
  existingSecret: order-backend-db
  name: production_db

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: "*"
      paths:
        - path: /
          pathType: Prefix
        - path: /admin
          pathType: Prefix
        - path: /metrics
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}
