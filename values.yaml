# Application Configuration Values: order-backend
nameOverride: ""
fullnameOverride: "order-backend"

replicaCount: 2   # ignorat când autoscaling.enabled=true

image:
  repository: mycompany-registry.io/apps/order-backend
  tag: "1.0.0"          # setat din CI
  digest: ""            # sha256:... setat din CI; are prioritate față de tag
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: order-backend
  automount: false

app:
  environment: production
  port: 8080

# Fără valori secrete aici; secretul vine din External Secrets.
database:
  existingSecret: order-backend-db   # chei: DATABASE_URL (sau DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME)
  externalSecret:
    enabled: true
    secretStoreRef:
      kind: ClusterSecretStore
      name: cloud-secrets            # Key Vault, Secrets Manager sau GCP Secret Manager
    remoteKey: orders/order-backend/db
    refreshInterval: 1h

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  startup:   { path: /healthz, periodSeconds: 5,  failureThreshold: 24 }
  readiness: { path: /readyz,  periodSeconds: 10, failureThreshold: 3 }
  liveness:  { path: /healthz, periodSeconds: 15, failureThreshold: 3 }

service:
  type: ClusterIP
  port: 80
  targetPort: http        # portul numit 8080 din container

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  hosts:
    - host: orders.mycompany.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: order-backend-tls
      hosts:
        - orders.mycompany.com
  # /admin și /metrics NU sunt publicate aici

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: true         # Prometheus colectează în cluster, nu prin ingress
    interval: 30s

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  egressTo:
    database:
      cidrOrSelector: {}  # selectorul sau CIDR-ul Postgres; port 5432
      port: 5432
    dns: true

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}